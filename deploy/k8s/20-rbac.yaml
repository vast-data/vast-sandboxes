  namespace: vastclaw-sales
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vastclaw-ui-admin-control
subjects:
  - kind: ServiceAccount
    name: default
    namespace: vastclaw-observability
