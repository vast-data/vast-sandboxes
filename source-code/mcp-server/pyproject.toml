[project]
name = "vastclaw-mcp"
version = "0.1.0"
description = "VAST protocols exposed to NVIDIA NemoClaw agents as secured, sandboxed MCP tools (earnings-call RAG domain)."
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.6,<2.0",
    "fastmcp>=2.0.0,<3.0.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "vastdb>=1.1.0",
    "boto3>=1.34",
    "adbc-driver-manager>=0.11",
    "pyarrow>=15.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9",
    "mypy>=1.14",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "types-pyyaml>=6.0",
]

[project.scripts]
vastclaw-mcp = "vastclaw_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
