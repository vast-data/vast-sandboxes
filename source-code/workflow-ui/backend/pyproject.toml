[project]
name = "vastclaw-ui"
version = "0.1.0"
description = "VastDB-backed workflow visualization API for vastclaw agents."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "pyjwt>=2.8",
    "vastdb>=1.1.0",
    "pyarrow>=15.0",
    "kubernetes>=29.0",
    "boto3>=1.34",
    "reportlab>=4.1",
    "httpx>=0.27",
    "openshell==0.0.85",
    "grpcio>=1.60",
    "protobuf>=4.25",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9",
    "mypy>=1.14",
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
