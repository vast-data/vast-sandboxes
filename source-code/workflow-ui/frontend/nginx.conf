# Map the client's Upgrade header to the right Connection value so the /api/ proxy
# transparently supports BOTH normal HTTP requests and WebSocket upgrades (the live
# agent shell at /api/v1/workflows/<id>/agents/<slug>/shell). Without this, WS
# upgrades are silently dropped and the browser shell shows "connection error".
# This file is included in the http{} context (conf.d/default.conf), so `map` is valid.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://vastclaw-workflow-ui-backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_http_version 1.1;
    # WebSocket upgrade (agent shell) + keep-alive for normal requests.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # Long-lived streams (shell / SSE) must not be cut by the default 60s read timeout.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }

  location = /healthz {
    proxy_pass http://vastclaw-workflow-ui-backend:8080/healthz;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
