[project]
name = "vastclaw-ingest"
version = "0.0.1"
description = "vast-claw earnings-call RAG (Earnings-21 prepare + NGC embed + VastDB ingest + search)"
requires-python = ">=3.10"
dependencies = [
    "vastdb==1.3.2",
    "adbc-driver-manager>=1.0.0",
    "pyarrow>=15,<17",
    "pydantic>=2.9,<3",
    "requests>=2.31",
    "PyYAML>=6.0.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["temp_ingest*"]
